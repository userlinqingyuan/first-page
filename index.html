<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>康奈尔日记 · 2024年3月20日</title>
    <style>
        /* 全局重置，确保在不同设备上一致 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0ede8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Georgia', 'Times New Roman', serif;
            padding: 20px;
        }
        /* 日记卡片样式（你原来的代码稍微调整了一下） */
        .diary-card {
            background: repeating-linear-gradient(
                to bottom,
                transparent,
                transparent 1.65em,
                #e8e8e8 1.65em,
                #e8e8e8 1.8em
            );
            line-height: 1.8em;
            padding: 20px;
            font-family: cursive, serif;
            font-size: 1.1em;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            background-color: #fffff8;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            margin: 20px;
        }
        /* 两栏布局 */
        .diary-grid {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }
        /* 左侧日期栏 */
        .date-column {
            border-right: 2px solid #ff6b6b;
            padding-right: 15px;
            text-align: right;
        }
        .date-column p {
            margin: 0;
        }
        .date-column .day {
            font-weight: bold;
            color: #ff6b6b;
        }
        .date-column .meta {
            color: #666;
        }
        .date-column .small {
            font-size: 0.9em;
            color: #888;
        }
        /* 右侧内容栏 */
        .content-column {
            padding: 0 10px;
        }
        .content-column p {
            margin: 0;
        }
        /* 底部总结栏 */
        .summary-bar {
            border-top: 2px solid #4dabf7;
            padding-top: 15px;
            padding-left: 170px;
            font-style: italic;
            color: #555;
        }
        .summary-bar p {
            margin: 0;
        }
        .summary-bar .title {
            font-weight: bold;
            color: #4dabf7;
        }

        /* 移动端适配：小屏幕时左侧日期栏变窄或折叠 */
        @media (max-width: 600px) {
            .diary-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .date-column {
                border-right: none;
                border-bottom: 2px solid #ff6b6b;
                padding-right: 0;
                padding-bottom: 10px;
                text-align: left;
            }
            .summary-bar {
                padding-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="diary-card">
        <!-- 上半部分：两栏布局 -->
        <div class="diary-grid">
            <!-- 左侧窄栏：日期信息 -->
            <div class="date-column">
                <p class="day">2024年3月20日</p>
                <p class="meta">星期三</p>
                <p class="meta">春分 · 晴</p>
                <p class="small">第80天</p>
            </div>
            
            <!-- 右侧宽栏：日记主体 -->
            <div class="content-column">
                <p>清晨的阳光透过窗帘洒在书桌上，今天决定尝试康奈尔笔记法的日记布局。</p>
                <p>上半部分左侧记录基本信息，右侧写详细的日记内容，下半部分做总结反思。</p>
                <p>这样的结构让日记既有条理又便于回顾，能够更好地记录生活点滴。</p>
                <p>下午在公园散步时，看到樱花已经开始绽放，春天真的来了。</p>
            </div>
        </div>
        
        <!-- 下半部分：横向总结栏 -->
        <div class="summary-bar">
            <p class="title">💭 今日小结：</p>
            <p>• 尝试了新的日记格式，结构清晰便于整理</p>
            <p>• 春天到来，心情随着天气变得明朗</p>
            <p>• 康奈尔法让记录和回顾都更加高效</p>
        </div>
    </div>
</body>
</html>
